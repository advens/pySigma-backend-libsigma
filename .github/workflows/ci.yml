name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  commit-msg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: check commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -eu
          if [ -n "${PR_TITLE:-}" ]; then
            printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" | scripts/check-commit-msg.sh --label "PR #${PR_NUMBER}" --stdin
          fi
          if [ -n "${BASE:-}" ]; then
            git rev-list --reverse "$BASE..$HEAD"
          else
            git rev-list --reverse -n 1 HEAD
          fi | while read -r c; do
            git log -1 --format=%B "$c" | scripts/check-commit-msg.sh --label "commit ${c}" --stdin
          done

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Both pySigma lines run in one job so the job names stay the ones
      # the main ruleset requires. 2.x is the current line. 1.x stays until
      # WAKE, which vendors this package, can install 2.x on FreeBSD 3.14t.
      - name: test
        run: |
          python -m pip install -e '.[dev]'
          for spec in "~=2.0" "~=1.5"; do
            python -m pip install "pysigma${spec}"
            python -c 'import importlib.metadata as m; print("pysigma", m.version("pysigma"))'
            python -m pytest -q
          done
